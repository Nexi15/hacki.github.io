<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baza Frakcji & Craftingu</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK (v8 Compat) - Ładowane bezpośrednio przed aplikacją -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-body: #0a0d14;
            --panel-bg: rgba(18, 24, 38, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(139, 92, 246, 0.4);
            
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-green: #10b981;

            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-head: 'Space Grotesk', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* EFEKTY TŁA */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -2;
            pointer-events: none;
            opacity: 0.3;
        }
        .orb-1 { width: 500px; height: 500px; background: var(--primary); top: -100px; left: -100px; }
        .orb-2 { width: 400px; height: 400px; background: var(--accent-cyan); bottom: -100px; right: -100px; }
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 28px 28px;
            z-index: -1;
        }

        /* GŁÓWNA KONTENER APLIKACJI */
        .app-container {
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* NAVBAR */
        .navbar {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-back:hover { background: rgba(255,255,255,0.08); transform: translateX(-2px); }

        .brand-text h1 { font-family: var(--font-head); font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; }
        .badge { font-size: 0.65rem; font-weight: 800; background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); padding: 2px 8px; border-radius: 4px; }

        .nav-actions { display: flex; gap: 10px; align-items: center; }

        /* PRZYCISKI */
        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); }
        .btn-primary { background: var(--primary); border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-admin.active { border-color: var(--primary); background: rgba(139, 92, 246, 0.2); color: #c4b5fd; }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
        .btn-admin.active .status-dot { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

        /* UKŁAD GLÓWNY */
        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 16px;
            flex: 1;
            min-height: 0;
        }

        /* SIDEBAR */
        .sidebar {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header h2 { font-family: var(--font-head); font-size: 0.8rem; color: var(--text-muted); letter-spacing: 1px; }

        .search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 10px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }
        .search-input:focus { border-color: var(--primary); }

        .org-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .org-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .org-card:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.15); }
        .org-card.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.05));
            border-color: var(--border-glow);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.15);
        }

        .org-card img { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; background: #000; }
        .org-card-info h3 { font-size: 0.9rem; font-weight: 700; }
        .org-card-info p { font-size: 0.75rem; color: var(--text-muted); }

        /* WIDOK GŁÓWNY */
        .content-area {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            overflow-y: auto;
        }

        .hero-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .hero-left { display: flex; align-items: center; gap: 20px; }
        .hero-logo { width: 72px; height: 72px; border-radius: 14px; object-fit: cover; border: 2px solid var(--border-glow); }
        .hero-title h2 { font-family: var(--font-head); font-size: 1.6rem; margin-bottom: 4px; }

        .section-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        .description-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            color: #cbd5e1;
            line-height: 1.6;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        .crafting-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .recipe-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }
        .recipe-header {
            display: flex; align-items: center; gap: 12px;
            padding-bottom: 12px; margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .recipe-header img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #000; }
        .recipe-header h4 { font-size: 0.95rem; font-weight: 700; }

        .ing-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 10px; border-radius: 6px; margin-bottom: 6px;
            font-size: 0.85rem; border: 1px solid var(--border-color);
        }
        .ing-qty { font-family: monospace; font-weight: bold; color: var(--accent-cyan); }

        /* FORMULARZ EDYCJI */
        .edit-form { display: flex; flex-direction: column; gap: 14px; }
        .edit-form label { font-size: 0.8rem; color: var(--text-muted); }
        .edit-form input, .edit-form textarea {
            background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-color);
            color: #fff; padding: 10px; border-radius: 8px; outline: none;
            font-family: inherit;
        }

        /* MODAL */
        .modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-card {
            background: #0f172a; border: 1px solid var(--border-color);
            padding: 24px; border-radius: 16px; width: 100%; max-width: 380px;
            display: flex; flex-direction: column; gap: 14px;
        }

        .hidden { display: none !important; }

        .loading-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; gap: 12px; color: var(--text-muted);
        }
        .spinner {
            width: 36px; height: 36px; border: 3px solid var(--border-color);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="bg-grid"></div>

    <div class="app-container">
        <!-- TOPBAR -->
        <header class="navbar">
            <div class="brand">
                <a href="../index.html" class="btn-back" title="Powrót">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </a>
                <div class="brand-text">
                    <h1>DATABASE & CRAFTING</h1>
                    <span class="badge">SYSTEM v3.0</span>
                </div>
            </div>

            <div class="nav-actions">
                <button id="adminBtn" class="btn btn-admin" onclick="openModal()">
                    <span class="status-dot"></span>
                    <span id="adminText">PANEL ADMINA</span>
                </button>
            </div>
        </header>

        <!-- DASHBOARD -->
        <div class="main-layout">
            <!-- LEWY PANEL -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>ORGANIZACJE</h2>
                    <button id="addOrgBtn" class="btn btn-primary hidden" style="padding: 4px 10px;" onclick="createNewOrg()">+</button>
                </div>
                <input type="text" class="search-input" id="searchInput" placeholder="Szukaj frakcji..." oninput="filterOrgs()">
                <div class="org-list" id="orgList"></div>
            </aside>

            <!-- PRAWY PANEL -->
            <main class="content-area" id="mainContent">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Łączenie z bazą danych Firebase...</p>
                </div>
            </main>
        </div>
    </div>

    <!-- MODAL LOGOWANIA -->
    <div class="modal hidden" id="loginModal">
        <div class="modal-card">
            <h3>PANEL ADMINISTRATORA</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Wprowadź hasło dostępowe:</p>
            <input type="password" id="passInput" class="search-input" placeholder="Hasło..." onkeydown="if(event.key==='Enter') loginAdmin()">
            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button class="btn" onclick="closeModal()">ANULUJ</button>
                <button class="btn btn-primary" onclick="loginAdmin()">ZALOGUJ</button>
            </div>
        </div>
    </div>

    <script>
        // --- KONFIGURACJA FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyARd3zgC_7SnLZG4c1rmx1E7TOK4sqy2zQ",
            authDomain: "lostmc-db.firebaseapp.com",
            databaseURL: "https://lostmc-db-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lostmc-db",
            storageBucket: "lostmc-db.firebasestorage.app",
            messagingSenderId: "400562944733",
            appId: "1:400562944733:web:f33720ac90878966557934",
            measurementId: "G-MLMBYZXXFF"
        };

        // Inicjalizacja
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- ZMIENNE APLIKACJI ---
        let dataStore = {};
        let selectedKey = null;
        let isAdmin = false;

        // --- GŁÓWNY SYSTEM NASŁUCHIWANIA DANYCH ---
        document.addEventListener("DOMContentLoaded", () => {
            const orgsRef = db.ref('organizacje');

            orgsRef.on('value', (snapshot) => {
                dataStore = snapshot.val() || {};
                const keys = Object.keys(dataStore);

                if (keys.length > 0 && (!selectedKey || !dataStore[selectedKey])) {
                    selectedKey = keys[0];
                }

                renderSidebar();
                renderView();
            }, (err) => {
                console.error("Błąd Firebase:", err);
                document.getElementById('mainContent').innerHTML = `
                    <div class="loading-state">
                        <p style="color: var(--accent-red);">Błąd połączenia z bazą danych Firebase. Sprawdź reguły dostępu.</p>
                    </div>
                `;
            });
        });

        // --- RENDEROWANIE SIDEBARA ---
        function renderSidebar() {
            const list = document.getElementById('orgList');
            list.innerHTML = '';

            const keys = Object.keys(dataStore);
            if (keys.length === 0) {
                list.innerHTML = `<div style="text-align:center; padding:12px; color:var(--text-muted); font-size:0.85rem;">Brak frakcji w bazie.</div>`;
                return;
            }

            keys.forEach(key => {
                const org = dataStore[key];
                const active = key === selectedKey;
                const count = org.recipes ? org.recipes.length : 0;

                const card = document.createElement('div');
                card.className = `org-card ${active ? 'active' : ''}`;
                card.onclick = () => { selectedKey = key; renderSidebar(); renderView(); };

                card.innerHTML = `
                    <img src="${org.logo || 'https://via.placeholder.com/42'}" alt="logo">
                    <div class="org-card-info">
                        <h3>${org.name || 'Bez nazwy'}</h3>
                        <p>${count} Receptur</p>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        // --- RENDEROWANIE WIDOKU GŁÓWNEGO ---
        function renderView() {
            const main = document.getElementById('mainContent');

            if (!selectedKey || !dataStore[selectedKey]) {
                main.innerHTML = `
                    <div class="loading-state">
                        <p>Brak wybranej frakcji. Utwórz nową w panelu admina.</p>
                    </div>
                `;
                return;
            }

            const org = dataStore[selectedKey];

            if (isAdmin && org.isEditing) {
                renderEditMode(main, org);
                return;
            }

            let recipesList = '';
            if (org.recipes && org.recipes.length > 0) {
                recipesList = org.recipes.map(r => `
                    <div class="recipe-card">
                        <div class="recipe-header">
                            <img src="${r.resultIcon || 'https://via.placeholder.com/44'}" alt="item">
                            <h4>${r.resultName || 'Przedmiot'}</h4>
                        </div>
                        <div class="section-title">SKŁADNIKI:</div>
                        ${(r.ingredients || []).map(i => `
                            <div class="ing-item">
                                <span>${i.name || 'Składnik'}</span>
                                <span class="ing-qty">x${i.amount || 1}</span>
                            </div>
                        `).join('')}
                    </div>
                `).join('');
            } else {
                recipesList = `<p style="color:var(--text-muted); font-size:0.85rem;">Ta frakcja nie posiada jeszcze dodanych receptur.</p>`;
            }

            main.innerHTML = `
                <div class="hero-banner">
                    <div class="hero-left">
                        <img src="${org.logo || 'https://via.placeholder.com/72'}" class="hero-logo">
                        <div class="hero-title">
                            <h2>${org.name || 'Bez nazwy'}</h2>
                            <span class="badge">FRAKCJA AKTYWNA</span>
                        </div>
                    </div>
                    ${isAdmin ? `<button class="btn" onclick="toggleEdit()">✏️ EDYTUJ</button>` : ''}
                </div>

                ${org.description ? `
                    <div class="section-title">INFORMACJE O FRAKCJI</div>
                    <div class="description-box">${org.description}</div>
                ` : ''}

                <div class="section-title">RECEPTURY CRAFTINGU</div>
                <div class="crafting-grid">${recipesList}</div>
            `;
        }

        // --- EDYCYJA (ADMIN) ---
        function renderEditMode(container, org) {
            container.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h3>Edytujesz: ${org.name}</h3>
                    <div style="display:flex; gap:8px;">
                        <button class="btn" onclick="toggleEdit()">ANULUJ</button>
                        <button class="btn btn-primary" onclick="saveOrg()">ZAPISZ</button>
                    </div>
                </div>

                <div class="edit-form">
                    <div>
                        <label>Nazwa organizacji:</label>
                        <input type="text" id="editName" value="${org.name || ''}" style="width:100%;">
                    </div>
                    <div>
                        <label>URL Logo:</label>
                        <input type="text" id="editLogo" value="${org.logo || ''}" style="width:100%;">
                    </div>
                    <div>
                        <label>Opis:</label>
                        <textarea id="editDesc" rows="5" style="width:100%;">${org.description || ''}</textarea>
                    </div>
                    <button class="btn" style="color:var(--accent-red); border-color:var(--accent-red); margin-top:10px;" onclick="deleteOrg()">USUŃ ORGANIZACJĘ</button>
                </div>
            `;
        }

        function toggleEdit() {
            if (!isAdmin) return;
            dataStore[selectedKey].isEditing = !dataStore[selectedKey].isEditing;
            renderView();
        }

        function saveOrg() {
            dataStore[selectedKey].name = document.getElementById('editName').value;
            dataStore[selectedKey].logo = document.getElementById('editLogo').value;
            dataStore[selectedKey].description = document.getElementById('editDesc').value;
            dataStore[selectedKey].isEditing = false;

            db.ref('organizacje/' + selectedKey).set(dataStore[selectedKey]);
        }

        function deleteOrg() {
            if (confirm("Czy na pewno chcesz usunąć tę organizację?")) {
                db.ref('organizacje/' + selectedKey).remove();
                delete dataStore[selectedKey];
                selectedKey = Object.keys(dataStore)[0] || null;
                renderSidebar();
                renderView();
            }
        }

        function createNewOrg() {
            if (!isAdmin) return;
            const newKey = 'org_' + Date.now();
            const newObj = {
                name: "Nowa Frakcja",
                logo: "",
                description: "Opis frakcji...",
                recipes: []
            };
            db.ref('organizacje/' + newKey).set(newObj);
            selectedKey = newKey;
        }

        // --- FILTROWANIE ---
        function filterOrgs() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.org-card');
            cards.forEach(c => {
                const text = c.innerText.toLowerCase();
                c.style.display = text.includes(q) ? 'flex' : 'none';
            });
        }

        // --- ADMIN MODAL ---
        function openModal() { document.getElementById('loginModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('loginModal').classList.add('hidden'); }

        function loginAdmin() {
            const pass = document.getElementById('passInput').value;
            if (pass === "admin123") {
                isAdmin = true;
                document.getElementById('adminBtn').classList.add('active');
                document.getElementById('adminText').innerText = "ADMIN [AKTYWNY]";
                document.getElementById('addOrgBtn').classList.remove('hidden');
                closeModal();
                renderSidebar();
                renderView();
            } else {
                alert("Niepoprawne hasło!");
            }
            document.getElementById('passInput').value = '';
        }
    </script>
</body>
</html>
