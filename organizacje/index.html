<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baza Frakcji & Craftingu | Cyberpunk UI</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK (Wersja v8 compat - stabilna dla skryptów w osobnym pliku) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Konfiguracja Twojej bazy Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyARd3zgC_7SnLZG4c1rmx1E7TOK4sqy2zQ",
            authDomain: "lostmc-db.firebaseapp.com",
            databaseURL: "https://lostmc-db-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lostmc-db",
            storageBucket: "lostmc-db.firebasestorage.app",
            messagingSenderId: "400562944733",
            appId: "1:400562944733:web:f33720ac90878966557934",
            measurementId: "G-MLMBYZXXFF"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
    </script>
</head>
<body>

    <!-- Animowany Glow w tle -->
    <div class="glow-orb orb-purple"></div>
    <div class="glow-orb orb-cyan"></div>
    <div class="bg-grid-pattern"></div>

    <div class="layout-wrapper">
        <!-- TOP NAVBAR -->
        <header class="navbar">
            <div class="nav-brand">
                <a href="../index.html" class="btn-back" title="Powrót">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </a>
                <div class="brand-title">
                    <span class="badge-v">SYSTEM v2.0</span>
                    <h2>DATABASE & CRAFTING</h2>
                </div>
            </div>

            <div class="nav-actions">
                <button id="adminLoginBtn" class="btn-admin" onclick="openAdminModal()">
                    <span class="status-dot"></span>
                    <span id="adminBtnText">PANEL ADMINA</span>
                </button>
            </div>
        </header>

        <!-- DASHBOARD BODY -->
        <div class="dashboard-grid">
            <!-- LEWY PANEL - ORGANIZACJE -->
            <aside class="sidebar-panel">
                <div class="sidebar-top">
                    <h3>FRAKCJE & ORGANIZACJE</h3>
                    <button id="addOrgBtn" class="btn-add hidden" onclick="addNewOrganization()" title="Dodaj nową organizację">+</button>
                </div>

                <div class="search-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="text" id="searchOrgInput" placeholder="Szukaj frakcji..." oninput="filterOrganizations()">
                </div>

                <div id="tabsContainer" class="org-list">
                    <!-- Karty organizacji dodawane z JS -->
                </div>
            </aside>

            <!-- PRAWY PANEL - INFORMACJE & CRAFTING -->
            <main id="mainView" class="content-panel">
                <div class="loading-state">
                    <div class="loader-spinner"></div>
                    <p>Połączenie z bazą Firebase...</p>
                </div>
            </main>
        </div>
    </div>

    <!-- MODAL ADMINA -->
    <div id="adminModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3>AUTORYZACJA ADMINA</h3>
                <p>Podaj kod dostępu, aby zarządzać bazą.</p>
            </div>
            <input type="password" id="adminPasswordInput" placeholder="Klucz autoryzacyjny..." onkeydown="if(event.key==='Enter') loginAdmin()">
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeAdminModal()">ANULUJ</button>
                <button class="btn-primary" onclick="loginAdmin()">WEJDŹ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
