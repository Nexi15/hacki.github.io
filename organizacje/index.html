<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baza Frakcji & Craftingu | NextGen UI</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyARd3zgC_7SnLZG4c1rmx1E7TOK4sqy2zQ",
            authDomain: "lostmc-db.firebaseapp.com",
            databaseURL: "https://lostmc-db-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lostmc-db",
            storageBucket: "lostmc-db.firebasestorage.app",
            messagingSenderId: "400562944733",
            appId: "1:400562944733:web:f33720ac90878966557934",
            measurementId: "G-MLMBYZXXFF"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
    </script>
</head>
<body>

    <!-- dynamiczne tło -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-grid"></div>

    <div class="app-wrapper">
        <!-- TOP NAVBAR -->
        <header class="navbar">
            <div class="nav-brand">
                <a href="../index.html" class="back-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </a>
                <div class="brand-text">
                    <span class="badge">DATABASE v2.0</span>
                    <h1>SYSTEM FRAKCJI</h1>
                </div>
            </div>

            <div class="nav-actions">
                <button id="adminLoginBtn" class="glass-btn admin-btn" onclick="toggleAdminModal()">
                    <span class="status-indicator"></span>
                    <span id="adminBtnText">PANEL ADMINA</span>
                </button>
            </div>
        </header>

        <!-- MAIN LAYOUT -->
        <div class="dashboard">
            <!-- LEWY PANEL - ORGANIZACJE -->
            <aside class="sidebar-panel">
                <div class="panel-header">
                    <h3>ORGANIZACJE</h3>
                    <button id="addOrgBtn" class="icon-btn add-org-btn hidden" onclick="addNewOrganization()" title="Dodaj organizację">+</button>
                </div>

                <div class="search-bar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="text" id="searchOrgInput" placeholder="Szukaj frakcji..." oninput="filterOrganizations()">
                </div>

                <div id="tabsContainer" class="org-cards-list">
                    <!-- Karty wstrzykiwane przez JS -->
                </div>
            </aside>

            <!-- PRAWY PANEL - GLÓWNY WIEW -->
            <main id="mainView" class="content-panel">
                <div class="loading-state">
                    <div class="pulse-loader"></div>
                    <p>Inicjalizacja połączenia z bazą...</p>
                </div>
            </main>
        </div>
    </div>

    <!-- MODAL -->
    <div id="adminModal" class="modal-overlay hidden">
        <div class="glass-card modal-box">
            <div class="modal-head">
                <h3>AUTORYZACJA ADMINA</h3>
                <p>Wprowadź klucz dostępowy, aby odblokować tryb edycji.</p>
            </div>
            <input type="password" id="adminPasswordInput" placeholder="Klucz autoryzacyjny..." onkeydown="if(event.key==='Enter') loginAdmin()">
            <div class="modal-foot">
                <button class="glass-btn" onclick="toggleAdminModal()">ANULUJ</button>
                <button class="primary-btn" onclick="loginAdmin()">ZALOGUJ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
