<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baza Frakcji & Craftingu</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="app-layout">
        <!-- TOP BAR -->
        <header class="top-bar">
            <div class="brand">
                <a href="../index.html" class="nav-back-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    <span>POWRÓT</span>
                </a>
                <div class="v-divider"></div>
                <div class="logo-text">
                    <span class="tag">NET</span>
                    <h2>ORGANIZACJE & CRAFTING</h2>
                </div>
            </div>

            <div class="top-actions">
                <button id="adminLoginBtn" class="admin-toggle-btn" onclick="toggleAdminModal()">
                    <span class="dot"></span>
                    <span id="adminBtnText">ZALOGUJ ADMINA</span>
                </button>
            </div>
        </header>

        <!-- MAIN CONTAINER -->
        <div class="main-body">
            <!-- SIDEBAR -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <span>LISTA ORGANIZACJI</span>
                    <button id="addOrgBtn" class="add-btn hidden" onclick="addNewOrganization()" title="Dodaj nową organizację">+</button>
                </div>

                <div id="tabsContainer" class="tabs-list">
                    <!-- Dynamiczne karty organizacji -->
                </div>
            </aside>

            <!-- DISPLAY AREA -->
            <main id="mainView" class="view-container">
                <!-- Dynamiczna zawartość -->
            </main>
        </div>
    </div>

    <!-- MODAL LOGOWANIA ADMINA -->
    <div id="adminModal" class="modal-backdrop hidden">
        <div class="modal-card">
            <h3>PANEL AUTORYZACJI</h3>
            <p>Wprowadź kod dostępu, aby edytować bazę.</p>
            <input type="password" id="adminPasswordInput" placeholder="Hasło..." onkeydown="if(event.key==='Enter') loginAdmin()">
            <div class="modal-actions">
                <button class="btn-secondary" onclick="toggleAdminModal()">ANULUJ</button>
                <button class="btn-primary" onclick="loginAdmin()">WEJDŹ</button>
            </div>
        </div>
    </div>

    <script src="../firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
