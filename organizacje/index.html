<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Frakcji & Organizacji</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="app-container">
        <!-- TOP NAVBAR -->
        <header class="top-nav">
            <div class="nav-brand">
                <a href="../index.html" class="btn-back">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    <span>POWRÓT</span>
                </a>
                <div class="divider"></div>
                <div class="brand-title">
                    <span class="badge">NETWORK</span>
                    <h1>BAZA ORGANIZACJI</h1>
                </div>
            </div>

            <div class="nav-actions">
                <button id="adminLoginBtn" class="btn-admin-login" onclick="toggleAdminModal()">
                    <span class="status-dot"></span>
                    <span id="adminBtnText">PANEL ADMINA</span>
                </button>
            </div>
        </header>

        <!-- MAIN LAYOUT -->
        <div class="main-wrapper">
            <!-- SIDEBAR (LISTA FRAKCJI) -->
            <aside class="sidebar-panel">
                <div class="sidebar-top">
                    <h2>ORGANIZACJE</h2>
                    <button id="addOrgBtn" class="btn-icon-add hidden" onclick="addOrganization()" title="Dodaj Frakcję">+</button>
                </div>

                <div id="tabsList" class="org-tabs-container">
                    <!-- Dynamicznie generowana lista -->
                </div>
            </aside>

            <!-- MAIN CONTENT AREA -->
            <main id="mainDisplay" class="content-display">
                <!-- Dynamiczny widok gracza / admina -->
            </main>
        </div>
    </div>

    <!-- MODAL LOGOWANIA ADMINA -->
    <div id="adminModal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3>AUTORYZACJA ADMINA</h3>
                <p>Podaj kod dostępu, aby edytować bazę frakcji.</p>
            </div>
            <div class="modal-body">
                <input type="password" id="adminPasswordInput" placeholder="Wprowadź hasło..." onkeydown="if(event.key==='Enter') loginAdmin()">
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="toggleAdminModal()">ANULUJ</button>
                <button class="btn-confirm" onclick="loginAdmin()">ZALOGUJ</button>
            </div>
        </div>
    </div>

    <!-- SKRYPTY -->
    <script src="../firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
