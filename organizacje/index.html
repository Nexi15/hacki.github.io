<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baza Frakcji & Craftingu</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK (Biblioteki Firebase) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 1. USTAWIENIA FIREBASE (Wszystko w jednym miejscu)
        const firebaseConfig = {
            apiKey: "TUTAJ_WKLEJ_SWÓJ_API_KEY",
            authDomain: "lostmc-db.firebaseapp.com",
            databaseURL: "https://lostmc-db-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lostmc-db",
            storageBucket: "lostmc-db.appspot.com",
            messagingSenderId: "TUTAJ_WKLEJ_SENDER_ID",
            appId: "TUTAJ_WKLEJ_APP_ID"
        };

        // Inicjalizacja połączenia
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
    </script>
</head>
<body>

    <div class="app-layout">
        <!-- TOP BAR -->
        <header class="top-bar">
            <div class="brand">
                <a href="../index.html" class="nav-back-btn">
                    <span>← POWRÓT</span>
                </a>
                <div class="v-divider"></div>
                <div class="logo-text">
                    <span class="tag">NET</span>
                    <h2>ORGANIZACJE & CRAFTING</h2>
                </div>
            </div>

            <div class="top-actions">
                <button id="adminLoginBtn" class="admin-toggle-btn" onclick="toggleAdminModal()">
                    <span class="dot"></span>
                    <span id="adminBtnText">ZALOGUJ ADMINA</span>
                </button>
            </div>
        </header>

        <!-- MAIN CONTAINER -->
        <div class="main-body">
            <!-- SIDEBAR -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <span>LISTA ORGANIZACJI</span>
                    <button id="addOrgBtn" class="add-btn hidden" onclick="addNewOrganization()" title="Dodaj nową organizację">+</button>
                </div>

                <div id="tabsContainer" class="tabs-list">
                    <!-- Dynamiczne karty organizacji -->
                </div>
            </aside>

            <!-- DISPLAY AREA -->
            <main id="mainView" class="view-container">
                <div style="color:var(--text-muted); text-align:center; padding-top:50px;">Ładowanie danych z bazy...</div>
            </main>
        </div>
    </div>

    <!-- MODAL LOGOWANIA ADMINA -->
    <div id="adminModal" class="modal-backdrop hidden">
        <div class="modal-card">
            <h3>PANEL AUTORYZACJI</h3>
            <p>Wprowadź kod dostępu, aby edytować bazę.</p>
            <input type="password" id="adminPasswordInput" placeholder="Hasło..." onkeydown="if(event.key==='Enter') loginAdmin()">
            <div class="modal-actions">
                <button class="btn-secondary" onclick="toggleAdminModal()">ANULUJ</button>
                <button class="btn-primary" onclick="loginAdmin()">WEJDŹ</button>
            </div>
        </div>
    </div>

    <!-- Skrypt obsługi widoku -->
    <script src="script.js"></script>
</body>
</html>
